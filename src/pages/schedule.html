<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Maestro Melisa: 3 Comidas + 4 Colaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .day-active { background: #4f46e5 !important; color: white !important; }
        .meal-main { border-left: 4px solid #4f46e5; background: #f5f3ff; }
        .meal-snack { border-left: 4px solid #ec4899; background: #fdf2f8; }
        .activity-block { border-left: 4px solid #94a3b8; background: #f8fafc; }
        .dog-block { border-left: 4px solid #10b981; background: #f0fdf4; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 p-4 flex justify-between items-center z-50">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-xl text-white">
                <i class="fas fa-utensils"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-slate-900 text-lg leading-none">Plan Nutricional Melisa</h1>
                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">3 Comidas Principales + 4 Colaciones</p>
            </div>
        </div>
        <button onclick="downloadExcel()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-2">
            <i class="fas fa-download"></i> Exportar Calendario
        </button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Navegación lateral -->
        <nav class="w-20 md:w-64 bg-white border-r border-slate-200 p-4 flex flex-col gap-2 overflow-y-auto shrink-0">
            <div id="day-buttons" class="space-y-1">
                <!-- Injected by JS -->
            </div>
        </nav>

        <!-- Contenido principal -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50">
            <div class="max-w-3xl mx-auto">
                <div id="day-info" class="mb-6">
                    <!-- JS -->
                </div>

                <div id="timeline" class="space-y-2">
                    <!-- JS -->
                </div>
            </div>
        </main>

        <!-- Panel lateral de Tienda -->
        <aside class="w-80 bg-white border-l border-slate-200 hidden xl:flex flex-col p-6 overflow-y-auto shrink-0">
            <h3 class="font-black text-slate-400 text-[10px] uppercase tracking-widest mb-4">Combustible de Tienda</h3>
            <div id="shopping-list" class="space-y-2 mb-6">
                <!-- JS -->
            </div>
            
            <div class="p-4 bg-amber-50 rounded-xl border border-amber-100">
                <h4 class="text-xs font-bold text-amber-800 mb-2">Regla de Oro</h4>
                <p class="text-[11px] text-amber-700 leading-relaxed">
                    Las colaciones evitan que el metabolismo se detenga. No te saltes el **Snack 4 (Recuperación)** tras la salsa o fútbol; es clave para evitar lesiones y dormir mejor.
                </p>
            </div>
        </aside>
    </div>

    <script>
        const schedule = {
            "Lunes": {
                desc: "Gym Tren Superior + Fútbol + Clases (9-1pm)",
                items: [
                    { t: "06:15", type: "snack", l: "Snack 1: Pre-Entreno", d: "Café + Galleta de avena (Energía para el gym)." },
                    { t: "06:30", type: "train", l: "GYM TREN SUPERIOR", d: "Rutina Melisa." },
                    { t: "07:30", type: "snack", l: "Snack 2: Post-Entreno", d: "Batido Prot. RTD + Plátano (Reparación)." },
                    { t: "07:50", type: "dog", l: "Paseo Perro (1/3)", d: "10 min." },
                    { t: "08:15", type: "meal", l: "DESAYUNO", d: "Avena lista + Yogurt griego (Tienda)." },
                    { t: "09:00", type: "class", l: "UNIVERSIDAD", d: "Bloque 9am - 1pm." },
                    { t: "11:00", type: "snack", l: "Snack 3: Colación Media Mañana", d: "Mix frutos secos (Control de saciedad)." },
                    { t: "13:10", type: "dog", l: "Paseo Perro (2/3)", d: "10 min." },
                    { t: "13:30", type: "meal", l: "ALMUERZO", d: "Ensalada domo + Atún pouch + Galletas integrales." },
                    { t: "14:30", type: "work", l: "TRABAJO (2H)", d: "Foco laboral." },
                    { t: "16:30", type: "study", l: "ESTUDIO (1H)", d: "Repaso académico." },
                    { t: "17:30", type: "rest", l: "DESCANSO (1H)", d: "Desconexión." },
                    { t: "18:30", type: "study", l: "TAREAS (1H)", d: "Entrega de trabajos." },
                    { t: "19:30", type: "snack", l: "Snack 4: Pre-Fútbol", d: "Barrita energética + Manzana." },
                    { t: "20:00", type: "dog", l: "Paseo Perro (3/3)", d: "10 min." },
                    { t: "20:30", type: "train", l: "FÚTBOL RÁPIDO", d: "Partido." },
                    { t: "22:15", type: "meal", l: "CENA", d: "Sándwich de pavo/queso + Aguacate (Tienda)." }
                ],
                store: ["Batido Prot. RTD", "Mix frutos secos", "Atún Pouch", "Ensalada Domo", "Barrita energética", "Sándwich preparado"]
            },
            "Martes": {
                desc: "Gym Piernas + Salsa (2h)",
                items: [
                    { t: "07:15", type: "snack", l: "Snack 1: Pre-Entreno", d: "Fruta pequeña (Energía)." },
                    { t: "07:30", type: "train", l: "GYM PIERNAS", d: "Rutina Melisa." },
                    { t: "08:45", type: "snack", l: "Snack 2: Post-Entreno", d: "Yogurt griego + Granola." },
                    { t: "09:10", type: "dog", l: "Paseo Perro (1/3)", d: "10 min." },
                    { t: "09:30", type: "meal", l: "DESAYUNO", d: "Huevos cocidos pack + Pan integral." },
                    { t: "10:30", type: "work", l: "TRABAJO (2H)", d: "Concentración." },
                    { t: "12:30", type: "snack", l: "Snack 3: Colación Tarde", d: "Puñado de nueces." },
                    { t: "13:00", type: "meal", l: "ALMUERZO", d: "Pasta precocida + Pechuga de pavo." },
                    { t: "14:00", type: "rest", l: "DESCANSO (1H)", d: "Pausa total." },
                    { t: "15:30", type: "dog", l: "Paseo Perro (2/3)", d: "10 min." },
                    { t: "16:00", type: "study", l: "ESTUDIO (1H)", d: "Repaso." },
                    { t: "17:00", type: "study", l: "TAREAS (1H)", d: "Avance." },
                    { t: "18:00", type: "snack", l: "Snack 4: Pre-Salsa", d: "Sándwich ligero + Jugo (Glucógeno)." },
                    { t: "19:45", type: "dog", l: "Paseo Perro (3/3)", d: "10 min." },
                    { t: "20:00", type: "train", l: "SALSA (2 HORAS)", d: "Intensidad técnica." },
                    { t: "22:15", type: "meal", l: "CENA", d: "Atún en sobre + Semillas calabaza (Magnesio)." }
                ],
                store: ["Huevos cocidos pack", "Pasta precocida", "Yogurt griego", "Pechuga de pavo pack"]
            },
            "Miércoles": {
                desc: "Fartlek + Salsa (2h) + Clases (9-1pm)",
                items: [
                    { t: "06:45", type: "snack", l: "Snack 1: Pre-Running", d: "Medio plátano." },
                    { t: "07:00", type: "train", l: "FARTLEK RUNNING", d: "25 min." },
                    { t: "07:35", type: "snack", l: "Snack 2: Post-Running", d: "Batido Prot. o Leche con chocolate." },
                    { t: "07:50", type: "dog", l: "Paseo Perro (1/3)", d: "10 min." },
                    { t: "08:15", type: "meal", l: "DESAYUNO", d: "Vaso de avena con chía/fruta." },
                    { t: "09:00", type: "class", l: "UNIVERSIDAD", d: "9am - 1pm." },
                    { t: "11:00", type: "snack", l: "Snack 3: Colación", d: "Queso tipo babybel o yogurt." },
                    { t: "13:10", type: "dog", l: "Paseo Perro (2/3)", d: "10 min." },
                    { t: "13:30", type: "meal", l: "ALMUERZO", d: "Bowl de pollo + Vegetales (Tienda)." },
                    { t: "14:30", type: "work", l: "TRABAJO (2H)", d: "Bloque único." },
                    { t: "16:30", type: "study", l: "ESTUDIO (1H)", d: "Repaso." },
                    { t: "17:30", type: "rest", l: "DESCANSO (1H)", d: "Pausa." },
                    { t: "18:30", type: "study", l: "TAREAS (1H)", d: "Avance." },
                    { t: "19:30", type: "snack", l: "Snack 4: Pre-Salsa", d: "Barrita de proteína." },
                    { t: "19:50", type: "dog", l: "Paseo Perro (3/3)", d: "10 min." },
                    { t: "20:00", type: "train", l: "SALSA (2 HORAS)", d: "Cardio." },
                    { t: "22:15", type: "meal", l: "CENA", d: "Ensalada de Atún (2 sobres)." }
                ],
                store: ["Bowl Pollo", "Leche chocolate", "Queso snack", "Barrita proteína"]
            }
        };

        // Generar otros días (plantilla similar)
        schedule["Jueves"] = JSON.parse(JSON.stringify(schedule["Martes"]));
        schedule["Jueves"].desc = "Salsa (2h)";
        schedule["Viernes"] = {
            desc: "Fútbol + Clases (1-5pm)",
            items: [
                { t: "08:15", type: "snack", l: "Snack 1", d: "Yogurt con granola." },
                { t: "08:30", type: "work", l: "TRABAJO (2H)", d: "Mañana." },
                { t: "10:30", type: "snack", l: "Snack 2", d: "Fruta + Nueces." },
                { t: "11:00", type: "study", l: "ESTUDIO (1H)", d: "Enfoque." },
                { t: "12:00", type: "meal", l: "DESAYUNO/ALMUERZO", d: "Sándwich doble pavo." },
                { t: "13:00", type: "class", l: "UNIVERSIDAD", d: "1pm - 5pm." },
                { t: "15:00", type: "snack", l: "Snack 3 (En Uni)", d: "Barrita de proteína." },
                { t: "17:10", type: "dog", l: "Paseo Perro (2/3)", d: "10 min." },
                { t: "17:30", type: "study", l: "TAREAS (1H)", d: "Cierre semana." },
                { t: "18:30", type: "rest", l: "DESCANSO (1H)", d: "Relax." },
                { t: "19:30", type: "snack", l: "Snack 4: Pre-Fútbol", d: "Fruta + Agua." },
                { t: "20:00", type: "dog", l: "Paseo Perro (3/3)", d: "10 min." },
                { t: "20:30", type: "train", l: "FÚTBOL", d: "Partido." },
                { t: "22:30", type: "meal", l: "CENA", d: "Pechuga de pavo + Aguacate." }
            ],
            store: ["Sándwich preparado", "Yogurt", "Barrita"]
        };

        let currentDay = "Lunes";

        function selectDay(day) {
            currentDay = day;
            const data = schedule[day];
            
            // UI Update
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('day-active'));
            document.getElementById(`btn-${day}`).classList.add('day-active');

            // Header
            document.getElementById('day-info').innerHTML = `
                <h2 class="text-3xl font-black text-slate-800 tracking-tighter">${day}</h2>
                <p class="text-indigo-600 font-bold text-xs uppercase tracking-widest mt-1">${data.desc}</p>
            `;

            // Timeline
            const tl = document.getElementById('timeline');
            tl.innerHTML = '';
            data.items.forEach(i => {
                const card = document.createElement('div');
                let typeClass = i.type === 'meal' ? 'meal-main' : (i.type === 'snack' ? 'meal-snack' : (i.type === 'dog' ? 'dog-block' : 'activity-block'));
                
                card.className = `p-3 rounded-lg shadow-sm border ${typeClass} flex items-center gap-4 transition-transform hover:scale-[1.01]`;
                card.innerHTML = `
                    <div class="w-10 text-[10px] font-black text-slate-400 border-r pr-2">${i.t}</div>
                    <div class="flex-1">
                        <h4 class="text-xs font-bold text-slate-800 uppercase tracking-tight">${i.l}</h4>
                        <p class="text-[10px] text-slate-500 leading-none mt-1">${i.d}</p>
                    </div>
                    ${i.type === 'meal' || i.type === 'snack' ? '<i class="fas fa-apple-alt text-[10px] text-pink-400"></i>' : ''}
                `;
                tl.appendChild(card);
            });

            // Store
            const shop = document.getElementById('shopping-list');
            shop.innerHTML = '';
            data.store.forEach(s => {
                const item = document.createElement('div');
                item.className = "text-[11px] text-slate-600 p-2 bg-slate-50 rounded border border-slate-100 flex items-center gap-2";
                item.innerHTML = `<i class="fas fa-check-circle text-indigo-500"></i> ${s}`;
                shop.appendChild(item);
            });
        }

        function renderNav() {
            const container = document.getElementById('day-buttons');
            Object.keys(schedule).forEach(day => {
                const b = document.createElement('button');
                b.id = `btn-${day}`;
                b.className = "day-btn w-full text-left px-4 py-3 rounded-xl text-xs font-bold transition-all hover:bg-slate-100 bg-white border border-slate-200";
                b.innerText = day;
                b.onclick = () => selectDay(day);
                container.appendChild(b);
            });
        }

        function downloadExcel() {
            const wb = XLSX.utils.book_new();
            Object.keys(schedule).forEach(day => {
                const content = [
                    ["HORA", "TIPO", "ACTIVIDAD / COMIDA", "DESCRIPCIÓN"],
                    ...schedule[day].items.map(i => [i.t, i.type.toUpperCase(), i.l, i.d])
                ];
                const ws = XLSX.utils.aoa_to_sheet(content);
                XLSX.utils.book_append_sheet(wb, ws, day);
            });
            XLSX.writeFile(wb, "Plan_Nutricional_7_Comidas_Melisa.xlsx");
        }

        window.onload = () => { renderNav(); selectDay("Lunes"); };
    </script>
</body>
</html>
